spring.application.name=rtm-fleet-maintenance
server.port=${APP_FLEET_MAINTENANCE_PORT:3002}

# Loads variables from the .env file (local only)
spring.config.import=optional:file:.env[.properties]

# Shared rentamovil database, using the fleet_app user (never sa)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Tables are created by rtm-fleet-maintenance-db (Liquibase). Hibernate only validates they match.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=fleet
# Dates are read and written in UTC (see FleetMaintenanceApplication)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# iam's static public key, to verify access tokens without calling it over the network
app.fleet.jwt.public-key=${APP_FLEET_MAINTENANCE_JWT_PUBLIC_KEY:}

# booking-reservation owns reservations. It's asked whether a vehicle is occupied for a range
# (GET /internal/reservations/vehicle-occupancy), service to service, not through the gateway
app.fleet.booking-url=${BOOKING_URL:http://localhost:3003}
app.fleet.booking-timeout=${BOOKING_TIMEOUT:3s}
# Retiring a vehicle checks non-cancelled reservations from today up to today + this many days
app.fleet.retire-reservation-horizon-days=${RETIRE_RESERVATION_HORIZON_DAYS:730}

# Shared key the other microservices must send in the X-Internal-Key header to call /internal/**.
# Same key across booking-reservation, fleet-maintenance, payment-billing and telemetry-gps.
app.internal.api-key=${APP_INTERNAL_API_KEY:}
